kind = "web"
previewPath = "/"
title = "Trade Marketing"
version = "1.0.0"
id = "artifacts/trade-marketing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22631

[services.development]
run = "pnpm --filter @workspace/trade-marketing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trade-marketing", "run", "build" ]
serve = "static"
publicDir = "artifacts/trade-marketing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22631"
BASE_PATH = "/"
